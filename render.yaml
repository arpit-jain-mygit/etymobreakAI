services:
  - type: web
    name: etymobreak-ai-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BROKER_URL
        sync: false
      - key: BROKER_SHARED_SECRET
        sync: false
      - key: GCP_ETYMOBREAK_BUCKET
        sync: false
